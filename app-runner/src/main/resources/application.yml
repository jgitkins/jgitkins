# 기본 설정
server:
  port: 8080
  servlet:
    context-path: /
---
# RabbitMQ Configuration
spring:
  datasource:
    driver-class-name: ${RUNNER_DB_DRIVER:org.h2.Driver}
#    url: ${RUNNER_DB_URL:jdbc:h2:file:~/runner;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    url: jdbc:h2:file:~/runner;AUTO_SERVER=TRUE
    username: ${RUNNER_DB_USERNAME:runner}
    password: ${RUNNER_DB_PASSWORD:runner}
  sql:
    init:
      mode: always
      schema-locations: classpath:/DDL.sql
      continue-on-error: true
  jpa:
    # DDL.sql owns the schema and the H2 file it creates outlives the process, holding the runner's
    # server token and settings. Hibernate must not touch it: Spring Boot picks create-drop by default
    # for a database it considers embedded, which would drop an activated runner's tables on the next
    # start and silently un-link it from the server. Stating none here does not depend on whether a
    # file-backed H2 URL counts as embedded in the Boot version in use.
    hibernate:
      ddl-auto: none
    open-in-view: false

runner:
  runner-name: ${RUNNER_NAME:local-runner}
  server-host: ${RUNNER_SERVER_HOST:localhost}
  server-port: ${RUNNER_SERVER_PORT:9090}
