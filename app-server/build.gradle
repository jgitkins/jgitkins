/* ---------- plugins ---------- */
plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.3'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'com.google.protobuf' version '0.9.4'
}

/* ---------- artifacts ---------- */
group = 'io.jgitkins.app.server'
version = '0.0.1'


java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

/* ---------- repositories ---------- */
repositories {
	mavenCentral()
	maven {
		url "https://repo.spring.io/milestone"
	}
}

ext {
	grpcVersion = '1.62.2'
	protobufVersion = '3.25.3'
}

// The Spring Boot 3.2.3 BOM pins Testcontainers 1.19.5, which ships docker-java 3.3.4. That
// client sends an unversioned /info to the Docker socket, and the socket Docker Desktop exposes
// today answers it with HTTP 400 and an empty body -- Testcontainers reports "Could not find a
// valid Docker environment" on a machine where `docker info` works fine. Overriding the BOM is
// the fix; it must be an explicit pin rather than a floating version so the day this breaks
// again, the version that broke it is in a commit.
dependencyManagement {
	imports {
		mavenBom 'org.testcontainers:testcontainers-bom:1.21.3'
	}
}

dependencies {
	implementation project(':core-common')
	implementation project(':core-web')
	implementation project(':core-security')
	implementation project(':core-persistence')
	implementation project(':core-grpc')

	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
//	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	implementation 'org.eclipse.jgit:org.eclipse.jgit:7.3.0.202506031305-r'
	implementation 'org.eclipse.jgit:org.eclipse.jgit.http.server:7.3.0.202506031305-r'

	// grpc server
	implementation 'net.devh:grpc-server-spring-boot-starter:2.15.0.RELEASE'
	implementation "io.grpc:grpc-protobuf:${grpcVersion}"
	implementation "io.grpc:grpc-stub:${grpcVersion}"
	implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
	compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	/**
	 * datasource
	 **/
	// TODO:
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
	// JPA lands alongside MyBatis, not instead of it: the persistence selector picks one
	// implementation per capability slice at the composition root, so both providers are on
	// the classpath for the whole length of the migration.
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.mariadb.jdbc:mariadb-java-client'
	implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16' // log4jdbc

	/**
	 * test
	 **/
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.testcontainers:mariadb'
	testImplementation 'org.testcontainers:junit-jupiter'

	// utility
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

	//docs
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

	// jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	// monitoring
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'



}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'spring.profiles.active', 'test'
	// The MariaDB test container loads this into /docker-entrypoint-initdb.d/. It lives in
	// data/, not src/test/resources, so it is not on the classpath and cannot be resolved with
	// forClasspathResource. An absolute path is used rather than a relative one because a
	// relative path resolves against the working directory, which differs between Gradle and an
	// IDE run -- and when it resolves to nothing the container comes up on an empty schema and
	// the mapping tests report success against no tables at all.
	systemProperty 'jgitkins.test.ddl', file('data/ddl.sql').absolutePath
	// docker-java defaults to Docker API 1.32. Current engines refuse it -- Docker Desktop's
	// minimum is 1.40 -- and the refusal arrives as an empty 200-shaped body with status 400,
	// which Testcontainers reports as "Could not find a valid Docker environment" on a machine
	// where `docker info` works. 1.41 is Docker 20.10 and older than anything still running.
	// Note this is the system property, not the DOCKER_API_VERSION environment variable: only
	// the property is read on the socket-discovery path that finds the daemon here.
	systemProperty 'api.version', '1.41'
}

bootJar {
	archiveFileName = 'app.jar'
}

protobuf {
	protoc {
		artifact = "com.google.protobuf:protoc:${protobufVersion}"
	}
	plugins {
		grpc {
			artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
		}
	}
	generateProtoTasks {
		all().each { task ->
			task.plugins {
				grpc {}
			}
		}
	}
}
