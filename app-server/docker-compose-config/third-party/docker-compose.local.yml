# Local evidence override for the third-party stack.
#
# Why this file exists: the base docker-compose.yml is written for the
# deployment host. It binds MariaDB on 0.0.0.0:3306 and mounts
# /opt/apps-data/jgitkins/... Neither works on a dev machine here:
# port 3306 is already held by another project's container, and /opt is
# not writable without sudo.
#
# This override keeps the base file untouched and changes only what a
# local MariaDB-evidence run needs:
#   - host port 53306 (container port stays 3306, so in-network clients
#     that reach the service as mariadb:3306 are unaffected)
#   - docker named volumes instead of /opt bind mounts (no sudo)
#   - distinct container names so nothing collides with other projects
#
# Usage:
#   docker network inspect jgitkins-net >/dev/null 2>&1 || docker network create jgitkins-net
#   docker compose \
#     -f app-server/docker-compose-config/third-party/docker-compose.yml \
#     -f app-server/docker-compose-config/third-party/docker-compose.local.yml \
#     up -d mariadb valkey
services:
  mariadb:
    container_name: jgitkins-mariadb-local
    ports: !override
      - "127.0.0.1:53306:3306"
    volumes: !override
      - jgitkins-mariadb-local-data:/var/lib/mysql

  valkey:
    container_name: jgitkins-valkey-local
    ports: !override
      - "127.0.0.1:56379:6379"
    volumes: !override
      - jgitkins-valkey-local-data:/data

volumes:
  jgitkins-mariadb-local-data:
  jgitkins-valkey-local-data:
