spring.datasource.url=jdbc:h2:mem:change_review;MODE=MariaDB;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
