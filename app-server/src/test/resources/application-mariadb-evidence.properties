# Real-MariaDB evidence profile.
#
# Tasks 2.69-2.77 require MariaDB-compatible evidence and explicitly reject
# H2-only evidence. Every other test profile in this module is
# jdbc:h2:mem:...;MODE=MariaDB, which is emulation, not evidence. This profile
# points at the local MariaDB brought up by
# app-server/docker-compose-config/third-party/docker-compose.local.yml
# (host port 53306, chosen so it does not collide with anything already bound
# to 3306), with the schema from app-server/data/ddl.sql already loaded.
#
# Bring the database up first:
#   docker network inspect jgitkins-net >/dev/null 2>&1 || docker network create jgitkins-net
#   docker compose \
#     -f app-server/docker-compose-config/third-party/docker-compose.yml \
#     -f app-server/docker-compose-config/third-party/docker-compose.local.yml \
#     up -d mariadb
#   docker exec -i jgitkins-mariadb-local mariadb -uroot -proot1234 JGITKINS < app-server/data/ddl.sql
#
# The driver is named explicitly rather than going through log4jdbc DriverSpy:
# log4jdbc.log4j2.properties sets log4jdbc.drivers=com.mysql.cj.jdbc.Driver with
# auto.load.popular.drivers=false, and no MySQL connector is on the classpath.
spring.datasource.hikari.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.jdbc-url=jdbc:mariadb://127.0.0.1:53306/JGITKINS
spring.datasource.hikari.username=root
spring.datasource.hikari.password=root1234
spring.sql.init.mode=never
JDBC_URL=jdbc:mariadb://127.0.0.1:53306/JGITKINS
JDBC_USERNAME=root
JDBC_PASSWORD=root1234
server.port=0
grpc.server.port=0
REST_PORT=0
GRPC_PORT=0
jgitkins.server.runtime.rest-port=0
jgitkins.server.runtime.grpc-port=0
jgitkins.server.runtime.service-host=localhost
jgitkins.server.runtime.rest-scheme=http
jgitkins.security.jwt.secret=test-jwt-secret-test-jwt-secret
jgitkins.security.jwt.ttl-seconds=900
SERVICE_HOST=localhost
REST_SCHEME=http
JGITKINS_JWT_SECRET=test-jwt-secret-test-jwt-secret
