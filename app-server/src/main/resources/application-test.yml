server:
  port: 18080

grpc:
  server:
    port: 19090

spring:
  datasource:
    hikari:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:jgitkins;MODE=MariaDB;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
      username: sa
      password:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client
            client-secret: test-secret

jgitkins:
  server:
    runtime:
      rest-port: 18080
      rest-base-path: /api
      grpc-port: 19090
      poll-interval-ms: 5000
      busy-wait-interval-ms: 1000
      volume: /tmp/jgitkins-test
      service-host: localhost
      rest-scheme: http
  security:
    jwt:
      secret: jgitkins-test-jwt-secret-256-bit-minimum
      ttl-seconds: 900
