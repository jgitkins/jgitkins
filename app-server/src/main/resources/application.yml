# tomcat
server:
  port: ${REST_PORT}
  servlet:
    context-path: /
---
# netty
grpc:
  server:
    port: ${GRPC_PORT}
---
# mybatis
mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml

---
# env
---
# Spring 설정
spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    # The migration swaps the persistence provider, never the schema. Tables are owned by
    # app-server/data/ddl.sql, so Hibernate must not create, update or validate them.
    hibernate:
      ddl-auto: none
    open-in-view: false
  datasource:
    hikari:
      driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
      jdbc-url: ${JDBC_URL}
      username: ${JDBC_USERNAME}
      password: ${JDBC_PASSWORD}
      pool-name: CP
      maximum-pool-size: 5
      connection-timeout: 8000
      max-lifetime: 147000
---
# Application
jgitkins:
  server:
    runtime:
#      rest-host: ${SERVICE_HOST}
      rest-port: ${REST_PORT}
      rest-base-path: /api
#      grpc-host: ${SERVICE_HOST}
      grpc-port: ${GRPC_PORT}
      poll-interval-ms: 5000
      busy-wait-interval-ms: 1000
      volume: ${BARE_PATH}
      service-host: ${SERVICE_HOST}
      rest-scheme: ${REST_SCHEME}
  security:
    jwt:
      secret: ${JGITKINS_JWT_SECRET}
      ttl-seconds: ${JGITKINS_JWT_TTL:900}

  # Persistence provider per capability slice. Absent means MyBatis, so every value here is a
  # deliberate cutover: these seven lines are what makes the JPA adapters the runtime path rather
  # than code that exists and is never constructed.
  #
  # Task 2.77 froze the MyBatis assets as RETAINED_BASELINE / DEFERRED_UNTIL_REFERENCE_ZERO and
  # authorised no removal, on the reasoning that the MyBatis adapter's construction IS the rollback.
  # That reasoning holds only while these keys are absent. Setting them supersedes it: the rollback
  # for a bad JPA slice is now flipping one line back to mybatis, and it stays available until the
  # MyBatis adapters are deleted at reference-zero.
  #
  # These are runtime properties. A -D flag at build time does not reach them.
  persistence:
    app-server:
      change-review-pull-request-reference:
        implementation: jpa
      organize-organize-member-reference:
        implementation: jpa
      execution-job-dispatch-query-reference:
        implementation: jpa
      execution-job-reference:
        implementation: jpa
      execution-runner-reference:
        implementation: jpa
      identity-access-reference:
        implementation: jpa
      repository-reference:
        implementation: jpa

---
# OAuth
#
# Guarded off the test profile. Left unguarded, provider.google.issuer-uri makes Spring Boot build
# the registration through ClientRegistrations.fromIssuerLocation, which calls
# accounts.google.com/.well-known/openid-configuration -- eagerly, at context startup, on every
# @SpringBootTest. A profile-specific file cannot unset a key its parent set, so the guard lives
# here and application-test.yml supplies static values instead.
spring:
  config:
    activate:
      on-profile: "!test"
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            issuer-uri: https://accounts.google.com
---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator