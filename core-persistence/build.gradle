plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'io.jgitkins.core'
version = '0.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.2.3"
    }
}

dependencies {
    // Was `api spring-jdbc` plus `api mybatis-spring-boot-starter`, and the starter was what actually
    // put spring-context and spring-boot on the compile classpath -- DataSourceConfig needs
    // @Configuration and @ConfigurationProperties, neither of which spring-jdbc carries. Removing the
    // starter with MyBatis broke this module's own compilation, so the transitive dependency is now
    // named: starter-jdbc is spring-jdbc, HikariCP and the Boot context, which is exactly this
    // module's job.
    api 'org.springframework.boot:spring-boot-starter-jdbc'

    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    runtimeOnly 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}
