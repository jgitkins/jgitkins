version: "3.9"

services:
  jgitkins-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ghcr.io/jgitkins/jgitkins-server:latest
    ports:
      - "18080:8084"
      - "19090:9090"
    # env_file:
    #   - env.properties
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SOPS_AGE_KEY_FILE: /opt/apps/jgitkins/config/sops/age/keys.txt
    volumes:
      - /opt/apps/jgitkins/bare:/opt/apps/jgitkins/bare
      - /opt/apps/jgitkins/config/sops/age/keys.txt:/opt/apps/jgitkins/config/sops/age/keys.txt
    networks:
      - jgitkins-net
    restart: unless-stopped

networks:
  jgitkins-net:
    external: true
