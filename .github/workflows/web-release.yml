name: web-release

on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/jgitkins-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/jgitkins-web:latest
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: web/docker-compose-config/apps/docker-compose.yml
          target: ${{ format('{0}/docker-compose-config/apps', secrets.DEPLOY_PATH) }}
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GITHUB_ACTOR,GITHUB_TOKEN,REGISTRY
          script: |
            set -e
            export PATH=/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
            echo "${GITHUB_TOKEN}" | docker login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin
            cd "${{ secrets.DEPLOY_PATH }}"
            docker-compose -f docker-compose-config/apps/docker-compose.yml pull jgitkins-web
            docker-compose -f docker-compose-config/apps/docker-compose.yml up -d --force-recreate jgitkins-web
            docker image prune -f
