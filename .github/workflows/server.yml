name: server

on:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: jgitkins-server-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Server Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests and build jar
        run: ./gradlew clean test bootJar

  image:
    name: Server Image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/jgitkins-server:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/jgitkins-server:latest

  deploy:
    name: Server Deploy
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_ALZAR }}
          username: ${{ secrets.SSH_USER_ALZAR }}
          key: ${{ secrets.SSH_KEY_ALZAR }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: server/docker-compose-config/apps/docker-compose.yml
          target: ${{ format('{0}/docker-compose-config/apps', secrets.DEPLOY_PATH_SERVER) }}

      - name: Deploy to home server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST_ALZAR }}
          username: ${{ secrets.SSH_USER_ALZAR }}
          key: ${{ secrets.SSH_KEY_ALZAR }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GITHUB_ACTOR,GITHUB_TOKEN,REGISTRY
          script: |
            set -e
            export PATH=/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
            echo "${GITHUB_TOKEN}" | docker login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin
            cd "${{ secrets.DEPLOY_PATH_SERVER }}"
            docker-compose -f docker-compose-config/apps/docker-compose.yml pull jgitkins-server
            docker-compose -f docker-compose-config/apps/docker-compose.yml up -d --force-recreate jgitkins-server
            docker image prune -f
