name: deploy

# Deploy is manual, and only manual. It does not share verify's triggers: an
# app-*-release.yml run scp's a compose file to a live host and recreates the
# service there, so a `pull_request` trigger would deploy every PR opened from a
# branch in this repository -- those runs receive secrets. `push: [develop]` is
# not carried over either; develop's last commit is 2026-04-02 and every branch
# since has been cut from main, so that trigger has not fired in five months.
# Moving deploy to `push: [main]` is a separate decision from installing the
# verify gate and is not made here.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      runner: ${{ steps.filter.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          SERVER_PATTERN: '^(app-server/|core-common/|core-security/|core-persistence/|core-grpc/|settings\.gradle$|\.github/workflows/deploy\.yml$|\.github/workflows/app-server-release\.yml$|\.github/workflows/app-server-verify\.yml$)'
          WEB_PATTERN: '^(app-web/|core-common/|core-web/|core-security/|settings\.gradle$|\.github/workflows/deploy\.yml$|\.github/workflows/app-web-release\.yml$|\.github/workflows/app-web-verify\.yml$)'
          RUNNER_PATTERN: '^(app-runner/|core-common/|core-grpc/|settings\.gradle$|\.github/workflows/deploy\.yml$|\.github/workflows/app-runner-release\.yml$|\.github/workflows/app-runner-verify\.yml$)'
        run: |
          bash .github/scripts/detect-changed-modules.sh

  server-verify:
    needs: detect
    if: needs.detect.outputs.server == 'true'
    uses: ./.github/workflows/app-server-verify.yml

  web-verify:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    uses: ./.github/workflows/app-web-verify.yml

  runner-verify:
    needs: detect
    if: needs.detect.outputs.runner == 'true'
    uses: ./.github/workflows/app-runner-verify.yml

  server:
    needs: [detect, server-verify]
    if: needs.detect.outputs.server == 'true'
    uses: ./.github/workflows/app-server-release.yml
    secrets: inherit

  web:
    needs: [detect, web-verify]
    if: needs.detect.outputs.web == 'true'
    uses: ./.github/workflows/app-web-release.yml
    secrets: inherit

  runner:
    needs: [detect, runner-verify]
    if: needs.detect.outputs.runner == 'true'
    uses: ./.github/workflows/app-runner-release.yml
    secrets: inherit
