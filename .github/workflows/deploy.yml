name: deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      runner: ${{ steps.filter.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          SERVER_PATTERN: '^(server/|\.github/workflows/deploy\.yml$|\.github/workflows/server-release\.yml$)'
          WEB_PATTERN: '^(web/|\.github/workflows/deploy\.yml$|\.github/workflows/web-release\.yml$)'
          RUNNER_PATTERN: '^(runner/|\.github/workflows/deploy\.yml$|\.github/workflows/runner-release\.yml$)'
        run: |
          bash .github/scripts/detect-changed-modules.sh

  server:
    needs: detect
    if: needs.detect.outputs.server == 'true'
    uses: ./.github/workflows/server-release.yml
    secrets: inherit

  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    uses: ./.github/workflows/web-release.yml
    secrets: inherit

  runner:
    needs: detect
    if: needs.detect.outputs.runner == 'true'
    uses: ./.github/workflows/runner-release.yml
    secrets: inherit
